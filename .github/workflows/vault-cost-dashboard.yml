name: Vault cost dashboard validation
on:
  pull_request:
    paths:
      - 'app/src/components/vault/VaultCostDashboard.tsx'
      - 'app/src/components/vault/VaultInterior.tsx'
      - 'app/src/lib/vault/cost-breakdown*'
      - 'app/src/lib/vault/recorded-cost.ts'
      - '.github/workflows/vault-cost-dashboard.yml'
permissions:
  contents: read
concurrency:
  group: vault-cost-dashboard-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            app/src
            app/scripts
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Cost and layout regression tests
        run: npm test -- src/lib/vault/cost-breakdown.test.ts
      - name: Lint changed sources
        if: ${{ !cancelled() }}
        run: npx --no-install eslint src/components/vault/VaultCostDashboard.tsx src/components/vault/VaultInterior.tsx src/lib/vault/cost-breakdown.ts src/lib/vault/cost-breakdown.test.ts
      - name: Full application TypeScript check
        if: ${{ !cancelled() }}
        run: npm run typecheck
